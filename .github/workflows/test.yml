name: Tests

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements-test.txt
    
    - name: Verify macOS commands available
      run: |
        which dns-sd || echo "Warning: dns-sd not found"
        which dscacheutil || echo "Warning: dscacheutil not found"
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=blucommand --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --tb=short --maxfail=5 --disable-warnings
      continue-on-error: false
      env:
        BLUCOMMAND_DEBUG: 0
        PYTHONUNBUFFERED: 1
        CI: true
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

